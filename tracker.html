<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finance Tracker Lite - Demo | MT Web Designs</title>
<meta name="description" content="Finance Tracker Lite: a bilingual demo by MT Web Designs. Add income and expenses and watch the balance keep up." />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --violet:#7a5cf0;
  --light-blue:#a8d8ff;
  --bg:#fafafa;
  --text:#333;
  --income:#1fa31f;
  --expense:#d42828;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

/* MT demo bar (same as the other demo pages) */
.demo-bar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#7a5cf0;color:#fff;font-size:.88rem;
  height:calc(36px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;white-space:nowrap}
.demo-bar .back{color:#fff;font-weight:600;text-decoration:none;padding:6px 0}
.demo-bar .back:hover span{text-decoration:underline}
.demo-bar .back:focus-visible{outline-color:#fff}
.demo-tag{font-size:.78rem;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:999px}

.wrap{max-width:640px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px));text-align:center}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:14px}
.lang button{padding:6px 10px;border-radius:6px;border:none;background:white;color:var(--violet);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--violet);color:white}
h1{color:var(--violet);font-size:1.5rem;line-height:1.25;margin-bottom:4px}
.subtitle{margin-bottom:6px}

/* Tracker (original styles, kept) */
.tracker-app{margin-top:12px;padding:14px;background:#eef3ff;border-radius:10px}
.tracker-display{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px;position:relative}
#balance{font-size:1.2rem}

/* Balance shown big */
#balance{font-size:2.2rem;font-weight:700;line-height:1.1;position:relative;display:inline-block}
#balance.negative{color:var(--expense)}

/* Tiny sparkle when an entry lands */
.sparkle{position:absolute;pointer-events:none;color:var(--violet);font-size:.9rem;opacity:0;animation:spark .7s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}

/* Totals row */
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.total{background:white;border-radius:10px;padding:8px 10px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.total span{display:block;font-size:.8rem;color:#666}
.total strong{font-size:1.05rem}
.total.in strong{color:var(--income)}
.total.out strong{color:var(--expense)}

/* Form (original styles, kept) */
#trackerForm{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
#trackerForm input,#trackerForm select{padding:8px;border-radius:6px;border:1px solid #d7dbe8;font-size:.95rem}
#trackerForm button{padding:8px 12px;border-radius:6px;border:none;background:var(--violet);color:white;cursor:pointer;font-weight:600}
.form-error{color:var(--expense);font-size:.85rem;min-height:1.3em;margin-top:6px}

/* List (original styles, kept) */
#transactions{list-style:none;margin-top:10px;padding:0}
#transactions li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:white;border-radius:6px;margin-top:8px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
li.income-item{color:var(--income)}
li.expense-item{color:var(--expense)}
.tx-left{display:flex;gap:12px;align-items:center;text-align:left}
.tx-delete{background:transparent;border:none;color:#999;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:4px}

/* Soft arrival */
#transactions li.arrive{animation:arrive .45s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  #transactions li.arrive{animation:none}
  .sparkle{display:none}
}
</style>
</head>
<body>

<div class="demo-bar">
  <a class="back" href="./#portfolio">← <span data-en="Back to MT Web Designs" data-fr="Retour à MT Web Designs">Back to MT Web Designs</span></a>
  <span class="demo-tag" data-en="Demo" data-fr="Démo">Demo</span>
</div>

<main class="wrap">
  <div class="lang" role="group" aria-label="Language / Langue">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="fr" aria-pressed="false">FR</button>
  </div>

  <h1 data-en="Finance Tracker Lite - Demo" data-fr="Finance Tracker Lite - Démo">Finance Tracker Lite - Demo</h1>
  <p class="subtitle" data-en="Balance Income & Expenses Live" data-fr="Équilibrer Revenus & Dépenses en Direct">Balance Income &amp; Expenses Live</p>

  <div class="tracker-app">
    <div class="tracker-display">
      <strong data-en="Current Balance" data-fr="Solde actuel">Current Balance</strong>
      <div id="balance" aria-live="polite">$0.00</div>
    </div>

    <div class="totals">
      <div class="total in"><span data-en="Total in" data-fr="Total des revenus">Total in</span><strong id="totalIn">+$0.00</strong></div>
      <div class="total out"><span data-en="Total out" data-fr="Total des dépenses">Total out</span><strong id="totalOut">-$0.00</strong></div>
    </div>

    <form id="trackerForm" novalidate>
      <input id="desc" name="desc" autocomplete="on"
             data-en-placeholder="Description" data-fr-placeholder="Description"
             placeholder="Description" required />
      <input id="amount" name="amount" type="number" step="0.01" min="0.01" inputmode="decimal"
             data-en-placeholder="Amount" data-fr-placeholder="Montant"
             placeholder="Amount" required />
      <select id="type" name="type">
        <option value="income" data-en="Income" data-fr="Revenu">Income</option>
        <option value="expense" data-en="Expense" data-fr="Dépense">Expense</option>
      </select>
      <button type="submit" data-en="Add" data-fr="Ajouter">Add</button>
    </form>
    <p class="form-error" id="formError" role="alert"></p>

    <ul id="transactions" aria-live="polite"></ul>
  </div>
</main>

<script>
(() => {
  const STORE = "mtwd-tracker-v1";
  const SAMPLES = [
    { desc: { en: "Website deposit", fr: "Acompte site Web" }, amount: 750, type: "income" },
    { desc: { en: "Boutique sale", fr: "Vente boutique" }, amount: 120, type: "income" },
    { desc: { en: "Café latte with a client", fr: "Café latte avec un client" }, amount: 6, type: "expense" },
    { desc: { en: "Pizza for the team", fr: "Pizza pour l'équipe" }, amount: 24, type: "expense" },
    { desc: { en: "Instagram ad test", fr: "Petit test pub Instagram" }, amount: 30, type: "expense" }
  ];
  const MSG = {
    en: { amount: "Enter an amount above zero.", desc: "Enter a description.", del: "Delete" },
    fr: { amount: "Entrez un montant supérieur à zéro.", desc: "Entrez une description.", del: "Supprimer" }
  };

  const $ = id => document.getElementById(id);
  const list = $("transactions"), balEl = $("balance");
  const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lang = "en", entries = [], shown = 0;

  // Money: -$25.00 / -25,00 $
  function money(v, sign) {
    const abs = Math.abs(v).toFixed(2);
    const s = v < 0 ? "-" : (sign && v > 0 ? "+" : "");
    return lang === "fr" ? `${s}${abs.replace(".", ",")} $` : `${s}$${abs}`;
  }

  function save() { try { localStorage.setItem(STORE, JSON.stringify(entries)); } catch (e) {} }
  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw === null) return null;
      const d = JSON.parse(raw);
      return Array.isArray(d) ? d.filter(x => x && x.amount > 0 && (x.type === "income" || x.type === "expense")) : null;
    } catch (e) { return null; }
  }

  const descText = e => typeof e.desc === "string" ? e.desc : (e.desc[lang] || e.desc.en);
  const totals = () => entries.reduce((t, e) => {
    if (e.type === "income") t.in += e.amount; else t.out += e.amount;
    return t;
  }, { in: 0, out: 0 });

  function itemEl(e, animate) {
    const li = document.createElement("li");
    li.className = e.type === "income" ? "income-item" : "expense-item";
    if (animate) li.classList.add("arrive");
    li.dataset.id = e.id;
    const left = document.createElement("div"); left.className = "tx-left";
    const d = document.createElement("span"); d.className = "tx-desc"; d.textContent = descText(e);
    const a = document.createElement("span"); a.className = "tx-amount"; a.textContent = money(e.amount);
    left.append(d, a);
    const del = document.createElement("button");
    del.type = "button"; del.className = "tx-delete"; del.textContent = "×";
    del.setAttribute("aria-label", MSG[lang].del + ": " + descText(e));
    li.append(left, del);
    return li;
  }

  let shownBalance = 0, tickId = 0;
  function showTotals(animate) {
    const t = totals(), target = t.in - t.out;
    $("totalIn").textContent = money(t.in, true);
    $("totalOut").textContent = money(-t.out);
    cancelAnimationFrame(tickId);
    if (!animate || reduce()) { shownBalance = target; paintBalance(); return; }
    const from = shownBalance, start = performance.now(), dur = 450;
    const step = now => {
      const k = Math.min(1, (now - start) / dur);
      shownBalance = from + (target - from) * (1 - Math.pow(1 - k, 3));
      paintBalance();
      if (k < 1) tickId = requestAnimationFrame(step); else { shownBalance = target; paintBalance(); }
    };
    tickId = requestAnimationFrame(step);
  }
  function paintBalance() {
    const v = Math.round(shownBalance * 100) / 100;
    balEl.textContent = money(v);
    balEl.classList.toggle("negative", v < 0);
  }

  function sparkle() {
    if (reduce()) return;
    const host = balEl.parentElement, r = balEl.getBoundingClientRect(), h = host.getBoundingClientRect();
    const cx = r.left - h.left + r.width / 2, cy = r.top - h.top + r.height / 2;
    for (let i = 0; i < 6; i++) {
      const s = document.createElement("span");
      s.className = "sparkle"; s.textContent = "✦"; s.setAttribute("aria-hidden", "true");
      const ang = (Math.PI * 2 * i) / 6 + Math.random() * 0.5, dist = 28 + Math.random() * 16;
      s.style.left = cx + "px"; s.style.top = cy - 8 + "px";
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist * 0.7 + "px");
      host.appendChild(s);
      setTimeout(() => s.remove(), 800);
    }
  }

  function renderAll() {
    list.innerHTML = "";
    entries.forEach(e => list.appendChild(itemEl(e, false)));
    showTotals(false);
  }

  function addEntry(e, animate) {
    e.id = e.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    entries.push(e); save();
    list.appendChild(itemEl(e, animate));
    showTotals(animate);
    if (animate) sparkle();
  }

  function applyLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll("[data-en]").forEach(el => { el.textContent = el.dataset[l]; });
    document.querySelectorAll("[data-en-placeholder]").forEach(el => { el.placeholder = el.dataset[l + "Placeholder"]; });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
    document.title = l === "fr" ? "Finance Tracker Lite - Démo | MT Web Designs" : "Finance Tracker Lite - Demo | MT Web Designs";
    if ($("formError").textContent) $("formError").textContent = "";
    // re-label existing entries and totals in the chosen language
    list.querySelectorAll("li").forEach(li => {
      const e = entries.find(x => x.id === li.dataset.id); if (!e) return;
      li.querySelector(".tx-desc").textContent = descText(e);
      li.querySelector(".tx-amount").textContent = money(e.amount);
      li.querySelector(".tx-delete").setAttribute("aria-label", MSG[lang].del + ": " + descText(e));
    });
    const t = totals(); $("totalIn").textContent = money(t.in, true); $("totalOut").textContent = money(-t.out); paintBalance();
    try { localStorage.setItem("mtwd-lang", l); } catch (e) {}
  }

  // Add
  $("trackerForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const desc = $("desc").value.trim();
    const amount = parseFloat($("amount").value);
    const type = $("type").value;
    const err = $("formError");
    if (!desc) { err.textContent = MSG[lang].desc; $("desc").focus(); return; }
    if (!(amount > 0)) { err.textContent = MSG[lang].amount; $("amount").focus(); return; }
    err.textContent = "";
    addEntry({ desc, amount: Math.round(amount * 100) / 100, type }, true);
    $("trackerForm").reset();
    $("type").value = "income";
  });

  // Delete
  list.addEventListener("click", ev => {
    const btn = ev.target.closest(".tx-delete"); if (!btn) return;
    const li = btn.closest("li");
    entries = entries.filter(x => x.id !== li.dataset.id); save();
    li.remove();
    showTotals(true);
  });

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));

  // Start
  let initial = (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
  try { const s = localStorage.getItem("mtwd-lang"); if (s === "en" || s === "fr") initial = s; } catch (e) {}
  applyLang(initial);

  const saved = load();
  if (saved) {
    entries = saved; renderAll();
  } else {
    // First visit: sample entries land one by one
    let i = 0;
    const next = () => {
      if (i >= SAMPLES.length) return;
      addEntry(JSON.parse(JSON.stringify(SAMPLES[i++])), true);
      setTimeout(next, reduce() ? 0 : 550);
    };
    setTimeout(next, reduce() ? 0 : 400);
  }
})();
</script>
</body>
</html>
